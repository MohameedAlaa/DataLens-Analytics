[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
# Show short tracebacks; suppress noisy warnings from httpx/starlette
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
log_cli = true
log_cli_level = WARNING
