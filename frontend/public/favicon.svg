<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="lensBg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181A1F" />
      <stop offset="100%" stop-color="#111215" />
    </linearGradient>
    <linearGradient id="lensRim" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4F237" />
      <stop offset="65%" stop-color="#A3C415" />
      <stop offset="100%" stop-color="#E06D53" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="100%" stop-color="#D6D3CB" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4F237" />
      <stop offset="100%" stop-color="#92B80F" />
    </linearGradient>
    <linearGradient id="barGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EA826B" />
      <stop offset="100%" stop-color="#C8573D" />
    </linearGradient>
    <filter id="lensGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#D4F237" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Base container squircle -->
  <rect width="48" height="48" rx="12" fill="url(#lensBg)" />
  <rect width="48" height="48" rx="12" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.2" />

  <!-- Outer lens focusing ring with gap -->
  <circle cx="24" cy="24" r="16.5" stroke="url(#lensRim)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="82 22" filter="url(#lensGlow)" />

  <!-- Inner precision lens aperture ring -->
  <circle cx="24" cy="24" r="11.5" stroke="rgba(161, 161, 170, 0.3)" stroke-width="1" stroke-dasharray="2 3" opacity="0.8" />

  <!-- Data Prism Bars (refracted through the lens) -->
  <!-- Bar 1 (Left: Warm Ivory) -->
  <rect x="16" y="24" width="3.5" height="10" rx="1.75" fill="url(#barGrad1)" />
  <!-- Bar 2 (Center: Acid Lime) -->
  <rect x="22.25" y="16" width="3.5" height="18" rx="1.75" fill="url(#barGrad2)" />
  <!-- Bar 3 (Right: Warm Terracotta) -->
  <rect x="28.5" y="20" width="3.5" height="14" rx="1.75" fill="url(#barGrad3)" />

  <!-- Focal lens focal-axis point -->
  <circle cx="24" cy="11.5" r="1.5" fill="#D4F237" />
</svg>
